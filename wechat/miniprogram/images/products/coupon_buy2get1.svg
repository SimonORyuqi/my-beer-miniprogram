<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A017;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BF8E14;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="16" fill="url(#bg)"/>
  <rect x="10" y="10" width="180" height="180" rx="12" fill="none" stroke="white" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- 买二送一图标 -->
  <circle cx="70" cy="80" r="20" fill="white" fill-opacity="0.3" stroke="white" stroke-width="2"/>
  <text x="70" y="88" font-size="20" fill="white" text-anchor="middle" font-weight="bold">2</text>
  
  <text x="100" y="88" font-size="24" fill="white" text-anchor="middle" font-weight="bold">+</text>
  
  <circle cx="130" cy="80" r="20" fill="white" fill-opacity="0.3" stroke="white" stroke-width="2"/>
  <text x="130" y="88" font-size="20" fill="white" text-anchor="middle" font-weight="bold">1</text>
  
  <!-- 箭头 -->
  <text x="100" y="125" font-size="20" fill="white" text-anchor="middle">→</text>
  
  <!-- 免费赠送 -->
  <circle cx="100" cy="150" r="20" fill="white" fill-opacity="0.5" stroke="white" stroke-width="2"/>
  <text x="100" y="158" font-size="16" fill="white" text-anchor="middle" font-weight="bold">免费</text>
  
  <text x="100" y="185" font-size="14" fill="white" text-anchor="middle" opacity="0.8">赠送券</text>
</svg>